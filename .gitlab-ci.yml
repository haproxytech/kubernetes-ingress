# forks lack the group registry variables; their pipelines can only fail
workflow:
  rules:
    - if: '$CI_REGISTRY_GO == null || $CI_REGISTRY_GO == ""'
      when: never
    - when: always

stages:
  - bots
  - diff
  - lint
  - unit-tests
  - build
  - e2e-generate
  - e2e-tests
include:
  - local: .gitlab/variables.yml
  - local: .gitlab/bots.yml
  - local: .gitlab/diff.yml
  - local: .gitlab/diff-warnings.yml
  - local: .gitlab/lint.yml
  - local: .gitlab/unit-tests.yml
  - local: .gitlab/build.yml
  - local: .gitlab/e2e-generate.yml
