apiVersion: kind.x-k8s.io/v1alpha4
networking:
  ipFamily: dual
  apiServerAddress: 0.0.0.0
  apiServerPort: 6443
# add to the apiServer certSANs the name of the docker (dind) service in order to be able to reach the cluster through it
kubeadmConfigPatchesJSON6902:
  - group: kubeadm.k8s.io
    version: KUBEADM_VER
    kind: ClusterConfiguration
    patch: |
      - op: add
        path: /apiServer/certSANs/-
        value: docker
kind: Cluster
nodes:
  - role: control-plane
    image: CI_REGISTRY_GO/kindest/node:K8S_VERSION
    extraPortMappings:
      - hostPort: 30080
        containerPort: 30080
        #listenAddress: "0.0.0.0" # Optional, defaults to "0.0.0.0"
        #protocol: udp # Optional, defaults to tcp
      - hostPort: 30443
        containerPort: 30443
      - hostPort: 31024
        containerPort: 31024
      - hostPort: 32766
        containerPort: 32766
      - hostPort: 32767
        containerPort: 32767
      - hostPort: 32060 # admin port
        containerPort: 32060
    kubeadmConfigPatches:
    # A single node cluster has nobody to elect against, and a busy runner can
    # stall the apiserver long enough for the lease to lapse, at which point
    # both components exit and the kubelet restarts them mid test.
    - |
      kind: ClusterConfiguration
      controllerManager:
          extraArgs:
            max-endpoints-per-slice: "5"
            leader-elect: "false"
      scheduler:
          extraArgs:
            leader-elect: "false"
    # stacked clusters share the kernel; conntrack sysctls are not ours to set
    - |
      kind: KubeProxyConfiguration
      conntrack:
        maxPerCore: 0
