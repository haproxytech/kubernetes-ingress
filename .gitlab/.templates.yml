.kind_deployment:
  retry: 2
  needs: []
  image: $CI_REGISTRY_GO/docker:$DOCKER_VERSION-go$GO_VERSION
  services:
    - name: $CI_REGISTRY_GO/docker:$DOCKER_VERSION-dind
      alias: docker
      variables:
        DOCKER_INSECURE_NO_IPTABLES_RAW: "1"
  tags:
    - go
  artifacts:
    when: on_failure
    paths:
      - logs
    expire_in: 1 week
  before_script:
    # stacked clusters exhaust the kernel's default inotify budget
    - sysctl -w fs.inotify.max_user_watches=1048576 fs.inotify.max_user_instances=8192 || echo "could not raise inotify limits"
    - docker login -u='$app' -p $CI_REGISTRY_TOKEN $CI_REGISTRY_GO
    - go version
    - go mod download &
    #- docker pull -q $CI_REGISTRY_GO/alpine:3
    #- docker image tag $CI_REGISTRY_GO/alpine:3 alpine:3
    #- docker pull -q $CI_REGISTRY_GO/golang:$GO_VERSION-alpine
    #- docker image tag $CI_REGISTRY_GO/golang:$GO_VERSION-alpine golang:$GO_VERSION-alpine
    - docker pull -q $CI_REGISTRY_GO/haproxytech/http-echo:latest
    - docker image tag $CI_REGISTRY_GO/haproxytech/http-echo:latest haproxytech/http-echo:latest
    - docker pull -q $CI_REGISTRY_GO/haproxytech/proxy-protocol:latest
    - docker image tag $CI_REGISTRY_GO/haproxytech/proxy-protocol:latest haproxytech/proxy-protocol:latest
    - ln -sf /tmp/kind/${KIND}/kind /usr/local/bin/kind
    - echo "expected kind version is $KIND"
    - kind version
    - sed -i "s/K8S_VERSION/$K8S_VERSION/g" ".gitlab/kind-config.yaml"
    - sed -i "s/KUBEADM_VER/$KUBEADM_VER/g" ".gitlab/kind-config.yaml"
    - sed -i "s~CI_REGISTRY_GO~$CI_REGISTRY_GO~g" ".gitlab/kind-config.yaml"
    - sed -i "s~FROM golang~FROM $CI_REGISTRY_GO/golang~g" "build/Dockerfile"
    - sed -i "s~FROM haproxytech/haproxy-alpine~FROM $CI_REGISTRY_GO/haproxy-alpine~g" "build/Dockerfile"
    - cat ./.gitlab/kind-config.yaml
    - kind create cluster --name=dev --config=./.gitlab/kind-config.yaml
    - sed -i -E -e "s/localhost|0\.0\.0\.0|127\.0\.0\.1/docker/g" "$HOME/.kube/config"
    - sed -i -E -e "s/localhost|0\.0\.0\.0|127\.0\.0\.1/docker/g" "deploy/tests/e2e/client.go"
    - until kubectl get nodes -o wide;do sleep 2; done
    - |
      while [ "$(kubectl get pods -A | grep -c "Running")" -lt 9 ]; do
          echo "Waiting for pods to be Running... Current count: $(kubectl get pods -A | grep -c "Running")"
          sleep 2
          COUNTER=$((COUNTER + 1))
          if [ $COUNTER -gt 480 ]; then
            echo "Timeout waiting for pods to be Running"
            exit 1
          fi
        done
    - kubectl get pods -A
  after_script:
    - kubectl get pods -A
    # keep enough state to explain a dead cluster
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        mkdir -p logs
        kubectl get events -A --sort-by=.lastTimestamp > logs/events.log 2>&1 || true
        kubectl -n kube-system logs -l k8s-app=kube-proxy --prefix --tail=-1 > logs/kube-proxy.log 2>&1 || true
        kubectl -n kube-system logs -l k8s-app=kube-proxy --prefix --previous --tail=-1 > logs/kube-proxy-previous.log 2>&1 || true
        kubectl -n kube-system logs -l k8s-app=kube-dns --prefix --tail=-1 > logs/coredns.log 2>&1 || true
        kubectl -n local-path-storage logs -l app=local-path-provisioner --prefix --previous --tail=-1 > logs/local-path-previous.log 2>&1 || true
        kubectl -n haproxy-controller logs -l run=haproxy-ingress --all-containers --prefix --tail=-1 > logs/ingress-controller.log 2>&1 || true
      fi
    - kind delete cluster --name=dev
  script:
    - go run ./cmd/gitlab-e2e-image
    - docker load -i tar/k8sIC.tar
    - CI_ENV=gitlab deploy/tests/create.sh
    - kubectl get pods -A
    - echo "running $E2E_TAG tests" && make -f Makefile.ci ci-e2e
