# Job sets rendered into the e2e child pipeline by cmd/gitlab-e2e-jobs.
# when: mr_or_push | schedule_weekly_<day> | never
jobs:
  - name: e2e_k8s
    stage: e2e_k8s
    when: mr_or_push
    parts: [parallel, https, sequential-1, sequential-2]
    variables:
      K8S_VERSION: v1.34.0
      KUBEADM_VER: v1beta3
      KUBECTL: v1.34.0

  # Disabled: this job set was already dormant, its file was never included.
  # Set when to schedule_weekly_monday to bring it back.
  - name: e2e_k8s_sch_1
    stage: e2e_k8s_sch_1
    when: never
    allow_failure: true
    parts: [parallel, https, sequential-1, sequential-2]
    variables:
      K8S_VERSION: v1.31.9
      KUBEADM_VER: v1beta3
      KUBECTL: v1.31.0

  # Disabled, see e2e_k8s_sch_1. Set when to schedule_weekly_tuesday to enable.
  - name: e2e_k8s_sch_2
    stage: e2e_k8s_sch_2
    when: never
    allow_failure: true
    parts: [parallel, https, sequential-1, sequential-2]
    variables:
      K8S_VERSION: v1.32.5
      KUBEADM_VER: v1beta3
      KUBECTL: v1.32.0

  - name: e2e_crd_v1
    stage: e2e_crd_versions
    when: schedule_weekly_wednesday
    allow_failure: true
    parts: [parallel, https, sequential-1, sequential-2]
    variables:
      K8S_VERSION: v1.34.0
      KUBEADM_VER: v1beta3
      KUBECTL: v1.34.0
      CRD_VERSION: v1
